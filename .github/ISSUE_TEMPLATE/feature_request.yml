name: Feature Request
description: Suggest a new capability
labels: ["enhancement"]
body:
  - type: checkboxes
    id: searched
    attributes:
      label: Before you file
      options:
        - label: I searched existing issues, including closed ones.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that you cannot do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should happen instead, and what would using it look like?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What you tried, and why it was not enough.
    validations:
      required: false
